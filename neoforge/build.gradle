plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.26'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        workingDirectory project.file('runs/client')
    }

    server {
        workingDirectory project.file('runs/server')
        arguments.add '--nogui'
    }
}

sourceSets.main {
    java {
        srcDir '../src/common/java'
        srcDir '../src/neoforge/java'
    }
    resources {
        srcDir '../src/common/resources'
        srcDir '../src/neoforge/resources'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

processResources {
    inputs.properties([
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ])

    filesMatching('META-INF/neoforge.mods.toml') {
        expand inputs.properties
    }
}
